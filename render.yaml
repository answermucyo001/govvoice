# Provision a managed MySQL database (e.g. PlanetScale, Aiven, AWS RDS, or Render's
# MySQL add-on) and set DB_HOST, DB_PORT, DB_USER, DB_PASSWORD and DB_NAME below.
services:
  - type: web
    name: govvoice
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: govvoice-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: cfcs
      - key: DATABASE_SSL
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: SMS_PROVIDER
        value: console
      # Set these after Render assigns your service URL, e.g. https://govvoice.onrender.com
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Required for uploads in production (Cloudinary is used by default).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Used only when RUN_SEED=true on the first deploy.
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ESCALATION_CRON
        value: "*/15 * * * *"
      - key: ENABLE_ESCALATION_JOB
        value: "true"
